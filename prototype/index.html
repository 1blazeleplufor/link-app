<title>LINK</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="LINK — prototype: find people to share events, outings and trips.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700;800&family=Syne:wght@600;800&family=Unbounded:wght@500;800&display=swap">
<style>
/* Layout: one mobile app column (max 440px) centred on desktop, full-bleed on phones; bottom tab bar. */
:root{
  --font-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg:#FFF7F0; --surface:#FFFFFF; --surface-2:#FFEDE1; --fg:#2B1A12; --muted:#7A6255;
  --line:#F1D9CA; --accent:#FF5A4E; --accent-fg:#FFFFFF; --accent-2:#FFC233; --accent-3:#0E9F9A;
  --ok:#1F8A4C; --warn:#B26A00; --bad:#C62D2D; --test:#7A3DD1;
  --radius:18px; --radius-sm:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1411; --surface:#271C17; --surface-2:#33251E; --fg:#FBEDE3; --muted:#C2A898;
    --line:#43322A; --accent:#FF7568; --accent-fg:#1C1411; --accent-2:#FFCF5C; --accent-3:#3CC9C3;
    --ok:#4CC17C; --warn:#F0A63A; --bad:#FF6B6B; --test:#B48CFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1411; --surface:#271C17; --surface-2:#33251E; --fg:#FBEDE3; --muted:#C2A898;
  --line:#43322A; --accent:#FF7568; --accent-fg:#1C1411; --accent-2:#FFCF5C; --accent-3:#3CC9C3;
  --ok:#4CC17C; --warn:#F0A63A; --bad:#FF6B6B; --test:#B48CFF; color-scheme:dark;
}
/* Direction 2 — Midnight Club: committed dark look in every theme */
:root[data-brand="midnight"]{
  --font-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --bg:#140F2E; --surface:#1E1842; --surface-2:#2A2257; --fg:#F4F0FF; --muted:#B5ABDB;
  --line:#3A3170; --accent:#FF3DA0; --accent-fg:#140F2E; --accent-2:#3FDFFF; --accent-3:#FFD23F;
  --ok:#4CE29A; --warn:#FFC24A; --bad:#FF6680; --test:#C9A6FF; color-scheme:dark;
}
/* Direction 4 — Afterglow: Midnight's night-blue base + the concert poster gradient (coral → fuchsia → violet) and gold.
   Built from Indira's feedback (she liked the Midnight layout and the concert poster colours). Committed dark look. */
:root[data-brand="afterglow"]{
  --font-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --bg:#130F2A; --surface:#1C1640; --surface-2:#271E52; --fg:#F7F1FF; --muted:#B8AED8;
  --line:#372C6C; --accent:#FF4D7E; --accent-fg:#FFFFFF; --accent-2:#FF7A4D; --accent-3:#FFC94A;
  --ok:#4CE29A; --warn:#FFC24A; --bad:#FF6680; --test:#C9A6FF; color-scheme:dark;
  --grad:linear-gradient(120deg,#FF6A4D 0%,#F0367F 45%,#9B2FD6 100%);
  --btn-bg:var(--grad);
}
/* Direction 3 — Riviera: sea blue, lemon, mint */
:root[data-brand="riviera"]{
  --font-display:"Syne", "Futura", system-ui, sans-serif;
  --bg:#F3F8FF; --surface:#FFFFFF; --surface-2:#E3EEFF; --fg:#0D2140; --muted:#56698A;
  --line:#CFDDF3; --accent:#1559D6; --accent-fg:#FFFFFF; --accent-2:#F2D635; --accent-3:#19B58C;
  --ok:#14804A; --warn:#A86400; --bad:#C42B3B; --test:#7A3DD1; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"])[data-brand="riviera"]{
    --bg:#0B1729; --surface:#13223B; --surface-2:#1B2E4D; --fg:#EAF2FF; --muted:#9FB3D3;
    --line:#2A3F63; --accent:#5B93FF; --accent-fg:#0B1729; --accent-2:#F5DF5A; --accent-3:#3FD3A8;
    --ok:#4CC17C; --warn:#F0A63A; --bad:#FF6B7A; --test:#B48CFF; color-scheme:dark;
  }
}
:root[data-theme="dark"][data-brand="riviera"]{
  --bg:#0B1729; --surface:#13223B; --surface-2:#1B2E4D; --fg:#EAF2FF; --muted:#9FB3D3;
  --line:#2A3F63; --accent:#5B93FF; --accent-fg:#0B1729; --accent-2:#F5DF5A; --accent-3:#3FD3A8;
  --ok:#4CC17C; --warn:#F0A63A; --bad:#FF6B7A; --test:#B48CFF; color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.03em;display:flex;align-items:center;gap:2px}
.logo .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-left:2px;transform:translateY(-8px)}
.logo .dot.b{background:var(--accent-2);margin-left:-3px}
.demo-pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--test);border:1px solid var(--line)}
main{flex:1;padding-block:14px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:25;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-inner{max-width:440px;width:100%;display:grid;grid-template-columns:repeat(6,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);min-height:56px;position:relative}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent)}
.tab.create svg{width:34px;height:34px;color:var(--accent-fg);background:var(--btn-bg, var(--accent));border-radius:12px;padding:6px}
:root[data-brand="afterglow"] .logo .dot{background:#FF6A4D}
:root[data-brand="afterglow"] .logo .dot.b{background:#C03BE0}
:root[data-brand="afterglow"] .seg button[aria-pressed="true"]{background:var(--grad);color:#fff;box-shadow:none}
:root[data-brand="afterglow"] .hero h1{background:linear-gradient(100deg,#FFFFFF 40%,#FFB3C8 75%,#E7A8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-brand="afterglow"] .tab[aria-current="page"]{color:#FF6A8E}
:root[data-brand="afterglow"] .card{border-color:var(--line);box-shadow:0 10px 30px -18px rgb(155 47 214 / .6)}
.tab .badge{position:absolute;top:5px;right:calc(50% - 18px);min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:10px;display:grid;place-items:center;padding:0 4px}

.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 6px;font-weight:700;font-size:13px;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap;min-height:36px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;min-height:44px}
textarea{min-height:84px;resize:vertical}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:700;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn-bg, var(--accent));color:var(--accent-fg)}
.btn.secondary{background:var(--surface-2);color:var(--fg)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:none;border:1px solid var(--bad);color:var(--bad)}
.btn.test{background:var(--test);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.card-body{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.event-card{display:block;text-align:left;width:100%;padding:0;color:inherit;background:none;border:0;font:inherit}
.event-card.person,.event-card.card-body{display:flex}
.event-card:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.visual{position:relative;aspect-ratio:16/8;max-width:100%;display:flex;align-items:flex-end;padding:12px;color:#fff;overflow:hidden}
.visual .cat{position:relative;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:rgb(0 0 0 / .35);padding:4px 9px;border-radius:999px;backdrop-filter:blur(4px)}
.visual .big{position:absolute;right:-6px;bottom:-26px;font-family:var(--font-display);font-weight:800;font-size:92px;line-height:1;opacity:.28;letter-spacing:-.05em;pointer-events:none;white-space:nowrap}
.visual .date-tag{position:absolute;top:12px;left:12px;background:#fff;color:#1a1a1a;border-radius:12px;padding:5px 9px;text-align:center;font-weight:800;line-height:1.05;font-size:18px}
.visual .date-tag small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:14px;height:14px}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.bad{color:var(--bad)} .status.test{color:var(--test)} .status.muted{color:var(--muted)}
.why{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.why b{font-weight:700;color:var(--accent-3)}
.price{font-weight:800;font-variant-numeric:tabular-nums}

.person{display:flex;gap:12px;padding:14px;align-items:flex-start}
.avatar{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:22px;color:#fff}
.avatar.lg{width:84px;height:84px;border-radius:26px;font-size:32px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);font-weight:600}
.tag.match{background:var(--accent-3);color:#fff}

.banner{border-radius:var(--radius);padding:14px;display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line)}
.banner.test{border-color:var(--test)}
.banner svg{flex:none;width:22px;height:22px;color:var(--test)}
.lock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:30px 18px}
.lock svg{width:46px;height:46px;color:var(--accent)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 18px;border:2px dashed var(--line);border-radius:var(--radius)}

.sheet-backdrop{position:fixed;inset:0;z-index:40;background:rgb(10 5 20 / .5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:440px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding-block:8px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .visual{border-radius:var(--radius);aspect-ratio:16/9}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.ticket-type{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.ticket-type[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.ticket{background:var(--surface);border:2px dashed var(--test);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;position:relative;overflow:hidden}
.ticket .watermark{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:64px;color:var(--test);opacity:.09;transform:rotate(-18deg);pointer-events:none}
.qr{background:#fff;padding:10px;border-radius:12px;width:180px;height:180px;display:grid;place-items:center}
.qr.revoked{filter:grayscale(1) blur(3px);opacity:.4}
.msgs{display:flex;flex-direction:column;gap:8px;padding:8px 0}
.bubble{max-width:80%;padding:9px 13px;border-radius:18px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-color:transparent}
.bubble time{display:block;font-size:10.5px;opacity:.7;margin-top:2px}
.composer{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding-block:8px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.switch{appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgb(0 0 0 / .3)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(20px)}
.brand-opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-align:left;width:100%}
.brand-opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.swatches{display:flex}
.swatches i{width:22px;height:44px;display:block}
.swatches i:first-child{border-radius:10px 0 0 10px}
.swatches i:last-child{border-radius:0 10px 10px 0}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0 / .25)}
.offline{background:var(--warn);color:#fff;font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px}
.matrix{width:100%;border-collapse:collapse;font-size:13px}
.matrix td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero{display:flex;flex-direction:column;gap:6px}
.hero h1 em{font-style:normal;color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Photos (demo stock images; tile with initial shows if an image cannot load) */
.ph{position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:28px;max-width:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar.ph{font-size:22px}
.pcard-photo{position:relative;aspect-ratio:4/4.4;max-width:100%}
.pcard-photo .ph{position:absolute;inset:0;font-size:72px}
.pcard-photo .overlay{position:absolute;inset:auto 0 0 0;padding:40px 14px 12px;background:linear-gradient(transparent,rgb(10 6 25 / .85));color:#fff;display:flex;flex-direction:column;gap:2px}
.pcard-photo .overlay h3{font-size:22px}
.pcard-photo .vbadge{position:absolute;top:12px;right:12px;background:rgb(0 0 0 / .45);color:#fff;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;display:flex;gap:4px;align-items:center;backdrop-filter:blur(4px)}
.pcard-photo .vbadge svg{width:14px;height:14px}
/* Hinge-style profile */
.hinge{display:flex;flex-direction:column;gap:12px}
.h-photo{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/5;max-width:100%}
.h-photo.sq{aspect-ratio:1}
.h-photo .ph{position:absolute;inset:0;font-size:96px}
.like{position:absolute;right:12px;bottom:12px;width:52px;height:52px;border-radius:50%;border:0;background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:0 6px 18px rgb(0 0 0 / .35)}
.like svg{width:26px;height:26px}
.prompt-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px 24px;display:flex;flex-direction:column;gap:8px}
.prompt-card .q{font-size:13px;font-weight:700;color:var(--muted)}
.prompt-card .a{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.25;padding-right:46px;overflow-wrap:anywhere}
.prompt-card .like{bottom:14px;right:14px;width:46px;height:46px;background:var(--surface-2)}
.vitals{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.vitals .vrow{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.vitals .vrow:last-child{border-bottom:0}
.vitals .vrow svg{width:18px;height:18px;flex:none;color:var(--muted)}
.vitals .vscroll{display:flex;gap:18px;overflow-x:auto;padding:12px 14px;border-bottom:1px solid var(--line);scrollbar-width:none;font-weight:600;font-size:14px}
.vitals .vscroll span{display:flex;gap:6px;align-items:center;white-space:nowrap}
.liked-box{border-left:4px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 12px 12px 0;font-size:14px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-grid .slot{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:28px;background:var(--surface)}
.photo-grid .slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-grid .slot .rm{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgb(0 0 0 / .6);color:#fff;display:grid;place-items:center}
.photo-grid .slot .rm svg{width:14px;height:14px}
.photo-grid label.slot{cursor:pointer}
:root[data-brand="afterglow"] .tag.match{color:#1C1640}
/* Afterglow — more gold (Indira liked the yellow touches) */
:root[data-brand="afterglow"] .prompt-card .q{color:var(--accent-3)}
:root[data-brand="afterglow"] .tab .badge{background:var(--accent-3);color:#1C1640}
:root[data-brand="afterglow"] .price{color:var(--accent-3)}
:root[data-brand="afterglow"] .label{color:var(--accent-3)}
:root[data-brand="afterglow"] .pcard-photo .vbadge{background:var(--accent-3);color:#1C1640}
/* Tappable faces and names (Activity, chat header) open the person's profile */
.face-btn,.name-btn{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:18px}
.face-btn{flex:none;transition:transform .15s}
.face-btn:hover,.face-btn:active{transform:scale(1.05)}
.name-btn:hover h3,.name-btn:hover h2{text-decoration:underline;text-underline-offset:3px}

function inviteRow(inv){

  const ev = allEvents().find(e=>e.id===inv.event) || S.outings.find(o=>o.id===inv.event);
  if(!p) return "";
  const st = {pending:["warn","pending"],accepted:["ok","accepted"],declined:["bad","declined"],cancelled:["muted","cancelled"]}[inv.status]||["muted",inv.status];
  const exp = new Date(); exp.setDate(exp.getDate()+(inv.d||3));
  return `<article class="card"><div class="person"><button class="face-btn" data-action="person" data-id="${p.id}" aria-label="${esc(t("view_profile",{n:p.name}))}">${avatar(p)}</button><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">

    <p class="small"><b>${esc(ev?ev.title:"—")}</b>${ev?` · ${esc(fmtDay(evDate(ev)))} · ${esc(cityById(ev.city).name)}`:""}</p>
    ${inv.note?`<p class="small muted">« ${esc(typeof inv.note==="string"?inv.note:loc(inv.note))} »</p>`:""}
    ${inv.status==="pending"?`<p class="small muted">${t("expires",{d:fmtDay(exp)})}</p>`:""}
    ${inv.status==="pending" && inv.dir==="in" ? `<div class="row"><button class="btn" data-action="inviteAccept" data-id="${inv.id}">${t("accept")}</button><button class="btn ghost" data-action="inviteDecline" data-id="${inv.id}">${t("decline")}</button></div>`:""}
    ${inv.status==="pending" && inv.dir==="out" ? `<div class="row"><button class="btn ghost" data-action="inviteCancel" data-id="${inv.id}">${t("cancel_invite")}</button></div>`:""}

let sheetCleanup = null;
function openSheet(html, onClose){
  closeSheet();
  const wrap = document.createElement("div");
  wrap.className = "sheet-backdrop"; wrap.id="sheetWrap";
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div>${html}</div>`;
  wrap.addEventListener("click", e=>{ if(e.target===wrap && S.onboarded) closeSheet(); });
  document.body.appendChild(wrap);
  document.body.style.overflow="hidden";
  sheetCleanup = onClose||null;
  const f = wrap.querySelector("button, input, select"); if(f) f.focus({preventScroll:true});
}
function closeSheet(){
  const w = document.getElementById("sheetWrap");
  if(w){ w.remove(); document.body.style.overflow=""; }
  if(sheetCleanup){ const c=sheetCleanup; sheetCleanup=null; c(); }
}

/* Ticketing: select → hold & pay (test) → confirmed / declined. */
let TK = null, tkTimer = null;
function ticketTypes(ev){
  const types = [{k:"standard", p:ev.price}];
  if(ev.avail==="verified") types.unshift({k:"early", p:Math.round(ev.price*0.8)});
  if(ev.price>=20) types.push({k:"vip", p:Math.round(ev.price*2.2)});
  return types;
}
function openTicketing(evId){
  const ev = allEvents().find(e=>e.id===evId);
  TK = {evId, type:ticketTypes(ev)[0].k, qty:1, step:"select", holdUntil:0};
  drawTicketing();
}
function drawTicketing(){
  const ev = allEvents().find(e=>e.id===TK.evId); const cur = cityById(ev.city).cur;
  const types = ticketTypes(ev); const tt = types.find(x=>x.k===TK.type);
  const sub = tt.p*TK.qty;
  let body="";
  if(TK.step==="select"){
    body = `<span class="label">${t("choose_ticket")}</span>
      <div class="list">${types.map(x=>`<button class="ticket-type" data-action="tkType" data-v="${x.k}" aria-pressed="${TK.type===x.k}"><b>${t(x.k)}</b><span class="price">${money(x.p,cur)}</span></button>`).join("")}</div>
      <div class="row" style="justify-content:space-between"><span class="label">${t("qty")}</span><div class="stepper"><button data-action="tkQty" data-v="-1" aria-label="-">−</button><b aria-live="polite">${TK.qty}</b><button data-action="tkQty" data-v="1" aria-label="+">+</button></div></div>`;
  }
  const summary = `<dl class="kv"><dt>${t("subtotal")}</dt><dd>${money(sub,cur)}</dd><dt>${t("fees")}</dt><dd>${esc(t("fees_free",{p:money(0,cur)}))}</dd><dt>${t("taxes")}</dt><dd>${t("taxes_incl")}</dd><dt><b>${t("total")}</b></dt><dd class="price">${money(sub,cur)}</dd></dl>`;
  if(TK.step==="select") body += summary + `<button class="btn block" data-action="tkNext">${t("buy")} · ${money(sub,cur)}</button>`;
  if(TK.step==="pay") body = `<p><b>${TK.qty} × ${t(TK.type)}</b></p>${summary}<p class="status warn" id="holdLabel">${t("hold",{t:"10:00"})}</p>
      <div class="banner test small">${I.flask}<p>${t("sandbox_note")}</p></div>
      <button class="btn block test" data-action="tkPay">${t("pay_test")}</button><button class="btn block ghost" data-action="tkDecline">${t("pay_fail")}</button>`;
  if(TK.step==="declined") body = `<div class="banner">${I.x.replace('<svg','<svg style="color:var(--bad)"')}<p>${t("declined_pay")}</p></div><button class="btn block" data-action="tkRetry">${t("back")}</button>`;
  if(TK.step==="expired") body = `<div class="banner">${I.clock}<p>${t("hold_over")}</p></div><button class="btn block" data-action="tkRetry">${t("back")}</button>`;
  if(TK.step==="done") body = `<div class="lock">${I.shield.replace('<svg','<svg style="color:var(--ok)"')}<h3>${t("paid")}</h3><p class="small muted">${t("order")} ${esc(TK.orderId)}</p></div><button class="btn block" data-action="tkWallet">${t("act_tickets")}</button>`;
  openSheet(`${sheetHead(ev.title)}${body}`, ()=>{ clearInterval(tkTimer); tkTimer=null; });
}
function startHold(){
  TK.holdUntil = Date.now()+10*60*1000;
  clearInterval(tkTimer);
  tkTimer = setInterval(()=>{
    const left = TK.holdUntil-Date.now();
    const el = document.getElementById("holdLabel");
    if(left<=0){ clearInterval(tkTimer); TK.step="expired"; drawTicketing(); return; }
    if(el){ const m=Math.floor(left/60000), s=Math.floor(left/1000)%60; el.textContent = t("hold",{t:`${m}:${String(s).padStart(2,"0")}`}); }
  }, 1000);
}
function openTicket(id){
  const tk = S.tickets.find(x=>x.id===id); if(!tk) return;
  const ev = allEvents().find(e=>e.id===tk.eventId);
  const status = tk.status==="refunded" ? `<span class="status bad">${t("refunded")}</span>` : tk.status==="scanned" ? `<span class="status muted">${esc(t("already",{t:tk.scannedAt}))}</span>` : `<span class="status test">${t("ticket_test")}</span>`;
  openSheet(`${sheetHead(ev?ev.title:"")}
    <div class="ticket"><span class="watermark" aria-hidden="true">TEST</span>
      <b>${esc(t("ticket_n",{i:tk.idx,n:tk.n}))} · ${esc(t(tk.type))}</b>

      ${status}

      <p class="small muted">${t("order")} ${esc(tk.orderId)}</p>

    ${tk.status==="valid"?`<button class="btn block danger" data-action="refund" data-id="${tk.id}">${t("refund")}</button>`:""}`);
  const box = document.getElementById("qrBox");
  try{ if(window.QRCode){ new QRCode(box,{text:"LINK-TEST:"+tk.token, width:160, height:160, correctLevel:QRCode.CorrectLevel.M}); } else box.textContent="QR"; }catch(e){ box.textContent="QR"; }

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){
  let el = document.getElementById("toast");
  if(!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>{ el.hidden=true; }, 3200);
}

/* ---------- actions ---------- */
function ensureConvo(pid, title, eventId){
  let c = S.convos.find(c=>pid ? c.with===pid : c.eventId===eventId);
  if(!c){ c = {id:uid("c"), with:pid||null, title, eventId:eventId||null, msgs:[]}; S.convos.unshift(c); }
  return c;
}
const A = {
  tab(el){ S.tab=el.dataset.v; openConvoId=null; save(); render(); window.scrollTo(0,0); },
  set(el){ S[el.dataset.k]=el.dataset.v; save(); render(true); },
  resetFilters(){ S.cat="all"; S.when="all"; S.budget="any"; S.mode="international"; save(); render(); },
  city(){ openCity(); },
  pickCity(el){ S.city=el.dataset.v; if(S.mode==="international") S.mode="local"; save(); closeSheet(); render(); },
  addCity(el){ const n=el.dataset.v.slice(0,60); if(!S.customCities.includes(n)) S.customCities.push(n); S.city="c:"+n; S.mode="local"; save(); closeSheet(); render(); },
  about(){ openAbout(); },
  event(el){ openEvent(el.dataset.id); },
  person(el){ openPerson(el.dataset.id); },
  peopleAll(el){ S.peopleAll = el.dataset.v==="1"; save(); render(true); },
  close(){ closeSheet(); render(true); },
  verify(){ openVerify(); },
  vSim(){ S.verif="pending"; save(); openVerify(); setTimeout(()=>{ S.verif="ok"; save(); openVerify(); render(true); toast(t("v_ok")); }, 1800); },
  vFail(){ S.verif="pending"; save(); openVerify(); setTimeout(()=>{ S.verif="failed"; save(); openVerify(); render(true); }, 1500); },
  vManual(){ S.verif="manual"; save(); openVerify(); render(true); },
  buy(el){ openTicketing(el.dataset.id); },
  tkType(el){ TK.type=el.dataset.v; drawTicketing(); },
  tkQty(el){ TK.qty=Math.max(1,Math.min(8,TK.qty+Number(el.dataset.v))); drawTicketing(); },
  tkNext(){ TK.step="pay"; drawTicketing(); startHold(); },
  tkDecline(){ clearInterval(tkTimer); TK.step="declined"; drawTicketing(); },
  tkRetry(){ TK.step="select"; drawTicketing(); },
  tkPay(){
    clearInterval(tkTimer);
    const ev = allEvents().find(e=>e.id===TK.evId); const tt = ticketTypes(ev).find(x=>x.k===TK.type);
    const orderId = "LNK-TEST-"+token().slice(0,6).toUpperCase();
    for(let i=1;i<=TK.qty;i++) S.tickets.unshift({id:uid("t"), orderId, eventId:ev.id, type:TK.type, idx:i, n:TK.qty, token:token(), status:"valid", scannedAt:null, price:tt.p, cur:cityById(ev.city).cur, created:new Date().toISOString()});
    TK.step="done"; TK.orderId=orderId; save(); drawTicketing();
  },
  tkWallet(){ closeSheet(); S.tab="activity"; S.actTab="tickets"; save(); render(); },
  ticket(el){ openTicket(el.dataset.id); },
  scan(el){
    const tk=S.tickets.find(x=>x.id===el.dataset.id); const out=document.getElementById("scanResult");
    if(tk.status==="valid"){ tk.status="scanned"; tk.scannedAt=now(); save(); openTicket(tk.id); document.getElementById("scanResult").innerHTML=`<span class="status ok">${esc(t("scanned_ok",{t:tk.scannedAt}))}</span>`; }
    else if(out){ out.innerHTML=`<span class="status bad">${esc(t("already",{t:tk.scannedAt}))}</span>`; }
    render(true);
  },
  refund(el){ const tk=S.tickets.find(x=>x.id===el.dataset.id); tk.status="refunded"; save(); openTicket(tk.id); render(true); toast(t("refunded")); },
  join(el){
    if(!requireVerified()) return;
    const ev = allEvents().find(e=>e.id===el.dataset.id);
    if(!S.joined.includes(ev.id)) S.joined.push(ev.id);
    ensureConvo(null, t("msg_group",{t:ev.title}), ev.id);
    save(); closeSheet(); S.tab="messages"; openConvoId = S.convos.find(c=>c.eventId===ev.id).id; render();
  },
  inviteFromEvent(el){ openPickPerson(el.dataset.id); },
  invitePersonEv(el){ openInvite(el.dataset.id, el.dataset.ev); },
  invitePerson(el){ openInvite(el.dataset.id); },
  sendInvite(el){
    const today = new Date().toDateString();
    const sentToday = S.invites.filter(i=>i.dir==="out" && new Date(i.created).toDateString()===today).length;
    if(sentToday>=10){ toast(t("invite_limit")); return; }
    const pid=el.dataset.id;
    const typed = document.getElementById("inv_note").value.trim();
    const note = likedNote ? `${t("liked")} « ${likedNote} »${typed?" — "+typed:""}` : typed;
    S.invites.unshift({id:uid("i"), dir:"out", to:pid, event:document.getElementById("inv_ev").value, note, status:"pending", d:3, created:new Date().toISOString()});
    likedNote = "";
    save(); closeSheet(); render(true); toast(t("invite_sent",{n:person(pid).name}));
  },
  inviteAccept(el){
    if(!requireVerified()) return;
    const inv=S.invites.find(i=>i.id===el.dataset.id); inv.status="accepted";
    const p=person(inv.from); const c=ensureConvo(p.id, p.name);
    if(!c.msgs.length) c.msgs.push({me:false, text:loc(inv.note), at:now()});
    save(); render(true); toast(t("accepted"));
  },
  inviteDecline(el){ S.invites.find(i=>i.id===el.dataset.id).status="declined"; save(); render(true); },
  inviteCancel(el){ S.invites.find(i=>i.id===el.dataset.id).status="cancelled"; save(); render(true); },
  invDir(el){ S.inviteDir=el.dataset.v; save(); render(true); },
  actTab(el){ S.actTab=el.dataset.v; save(); render(true); },
  convo(el){ openConvoId=el.dataset.id; render(); },
  convoBack(){ openConvoId=null; render(); },
  block(el){ const p=person(el.dataset.id); if(!S.blocked.includes(p.id)) S.blocked.push(p.id); save(); closeSheet(); render(true); toast(t("blocked",{n:p.name})); },
  unblock(el){ S.blocked=S.blocked.filter(x=>x!==el.dataset.id); save(); render(true); },
  report(el){ openReport(el.dataset.id); },
  reportSend(el){ S.reports.push({pid:el.dataset.id, reason:el.dataset.v, at:new Date().toISOString()}); save(); closeSheet(); render(true); toast(t("report_sent")); },
  ctype(el){ createType=el.dataset.v; render(true); },
  outingDelete(el){ S.outings=S.outings.filter(o=>o.id!==el.dataset.id); save(); render(true); },
  modApprove(el){ S.outings.find(o=>o.id===el.dataset.id).status="approved"; save(); render(true); toast(t("approved")); },
  modReject(el){ S.outings.find(o=>o.id===el.dataset.id).status="rejected"; save(); render(true); },
  pLang(el){ toggleIn(S.profile.langs, el.dataset.v); save(); render(true); },
  pInt(el){ toggleIn(S.profile.interests, el.dataset.v); save(); render(true); },
  pMusic(el){ toggleIn(S.profile.music, el.dataset.v); save(); render(true); },
  saveProfile(){
    const g = id=>document.getElementById(id);
    S.profile.name=g("p_name").value.trim().slice(0,40); S.profile.bio=g("p_bio").value.trim(); S.profile.city=g("p_city").value;
    S.profile.job=g("p_job").value.trim().slice(0,60);
    S.profile.prompts = S.profile.prompts.map((_,i)=>({q:g("pq_"+i).value, a:g("pa_"+i).value.trim().slice(0,150)}));
    save(); render(true); toast(t("saved"));
  },
  preview(){ A.saveProfile(); openPerson("me"); },
  like(el){ openInvite(el.dataset.id, null, el.dataset.v); },
  pLf(el){ toggleIn(S.profile.lookingFor, el.dataset.v); save(); render(true); },
  pAv(el){ S.profile.availability=el.dataset.v; save(); render(true); },
  photoDel(el){ S.profile.photos.splice(Number(el.dataset.v),1); save(); render(true); },
  tripAdd(){ S.profile.trips.push({city:document.getElementById("tr_city").value, from:document.getElementById("tr_from").value, to:document.getElementById("tr_to").value}); save(); render(true); toast(t("saved")); },
  tripDel(el){ S.profile.trips.splice(Number(el.dataset.v),1); save(); render(true); },
  vis(el){ S.profile.visibility=el.dataset.v; save(); render(true); },
  brand(el){ S.brand=el.dataset.v; save(); applyLook(); document.querySelectorAll('[data-action="brand"]').forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===S.brand)); if(S.onboarded) render(true); },
  theme(el){ S.theme=el.dataset.v; save(); render(true); },
  export(){ openExport(); },
  copyExport(){ const ta=document.getElementById("exportBox"); navigator.clipboard.writeText(ta.value).then(()=>toast("✓")).catch(()=>{ ta.select(); }); },
  resetAsk(){ openResetConfirm(); },
  resetDo(){ const keep={lang:S.lang, brand:S.brand}; S=Object.assign(DEFAULT_STATE(), keep, {onboarded:true}); save(); closeSheet(); render(); toast(t("reset_done")); },
  obStart(){ S.profile.name=document.getElementById("ob_name").value.trim().slice(0,40); S.onboarded=true; save(); closeSheet(); render(); }
};
/* Resize to max 900 px JPEG before keeping it on this device (localStorage space is small). */
function addPhoto(file){
  if(!file.type.startsWith("image/")) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const k = Math.min(1, 900/Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const url = c.toDataURL("image/jpeg", 0.78);
      S.profile.photos.push(url);
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){ S.profile.photos.pop(); toast("Storage full"); return; }
      render(true);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function toggleIn(arr, v){ const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); }

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-action]");
  if(!el || el.tagName==="SELECT" || (el.tagName==="INPUT" && el.type==="checkbox")) return;
  const fn = A[el.dataset.action]; if(fn){ e.preventDefault(); fn(el); }
});
document.addEventListener("change", e=>{
  const el = e.target;
  if(el.dataset.action==="lang"){ S.lang=el.value; save(); const ob=!S.onboarded; if(ob){ closeSheet(); } render(true); if(ob) openOnboarding(); return; }
  if(el.dataset.action==="toggle"){
    const map = {tg_age:()=>S.profile.showAge=el.checked, tg_dating:()=>S.profile.dating=el.checked,
      tg_n_invites:()=>S.notif.invites=el.checked, tg_n_messages:()=>S.notif.messages=el.checked, tg_n_events:()=>S.notif.events=el.checked,
      tg_n_tickets:()=>S.notif.tickets=el.checked, tg_n_marketing:()=>S.notif.marketing=el.checked};
    if(map[el.id]){ map[el.id](); save(); }
  }
  if(el.id==="photoInput" && el.files && el.files[0]) addPhoto(el.files[0]);
  if(el.id==="q_from"||el.id==="q_to"){ S.notif[el.id==="q_from"?"quietFrom":"quietTo"]=el.value; save(); render(true); }
});
document.addEventListener("submit", e=>{
  e.preventDefault();
  if(e.target.id==="createForm"){
    const g = id=>document.getElementById(id).value.trim();
    const o = {id:uid("o"), type:createType, title:g("c_title"), cat:g("c_cat"), city:g("c_city"), date:g("c_date"), time:g("c_time"), place:g("c_place"), cap:Math.max(2,Number(g("c_cap"))||6), desc:g("c_desc"), rules:g("c_rules"), status:createType==="public"?"pending":"private", created:new Date().toISOString()};
    if(!o.title||!o.city||!o.date||!o.time){ toast(t("form_missing")); return; }
    S.outings.unshift(o); save(); S.tab="activity"; S.actTab="outings"; render(); window.scrollTo(0,0);
    toast(createType==="public"?t("created_public"):t("created_private"));
  }
  if(e.target.id==="composer"){
    const inp=document.getElementById("msgInput"); const txt=inp.value.trim(); if(!txt) return;
    const c=S.convos.find(c=>c.id===openConvoId); c.msgs.push({me:true, text:txt, at:now()}); save(); render(); document.getElementById("msgInput").focus();
  }
});
// A photo that cannot load (offline, blocked host) is removed so the coloured tile with the initial shows.
document.addEventListener("error", e=>{ if(e.target && e.target.tagName==="IMG" && e.target.parentElement && e.target.parentElement.classList.contains("ph")) e.target.remove(); }, true);
window.addEventListener("online", ()=>render(true));
window.addEventListener("offline", ()=>render(true));
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && S.onboarded) closeSheet(); });

render();
})();
</script>
