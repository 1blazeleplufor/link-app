<!-- LINK version switcher: identical in every published version (v0, v1, v2). Self-contained, neutral colours. -->
<style>
#lnkv{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:35;font:600 13px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
#lnkv>button{border:1px solid rgb(255 255 255 / .25);background:rgb(20 16 40 / .88);color:#fff;border-radius:999px;padding:8px 13px;min-height:38px;backdrop-filter:blur(6px);box-shadow:0 6px 18px rgb(0 0 0 / .3);cursor:pointer}
#lnkv-menu{position:absolute;right:0;bottom:46px;width:250px;background:#1A1538;color:#fff;border:1px solid rgb(255 255 255 / .15);border-radius:16px;padding:6px;box-shadow:0 12px 30px rgb(0 0 0 / .4)}
#lnkv-menu a{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;color:#fff;text-decoration:none}
#lnkv-menu a:hover,#lnkv-menu a:focus-visible{background:rgb(255 255 255 / .08)}
#lnkv-menu a[aria-current="page"]{background:rgb(255 255 255 / .12)}
#lnkv-menu small{color:#C8BFE6;font-weight:400}
#lnkv-menu b{font-weight:700}
</style>
<div id="lnkv">
  <div id="lnkv-menu" hidden role="menu" aria-label="Versions">
    <a role="menuitem" data-v="v0" href="https://1blazeleplufor.github.io/link-app/v0/"><b>v0 · Première version</b><small>3 thèmes, profils simples</small></a>
    <a role="menuitem" data-v="v1" href="https://1blazeleplufor.github.io/link-app/v1/"><b>v1 · Afterglow + profils</b><small>Couleurs de l'affiche, profils façon Hinge</small></a>
    <a role="menuitem" data-v="v2" href="https://1blazeleplufor.github.io/link-app/"><b>v2 · Actuelle</b><small>Profil de Noë, touches dorées, filtres sans jaune</small></a>
    <a role="menuitem" data-v="feedback" href="https://claude.ai/artifact/L5uNNEW4BNeqrVw7YnMTKg" style="border-top:1px solid rgb(255 255 255 / .12);margin-top:4px"><b>✎ Envoyer un retour</b><small>Consignes, remarques et photos pour Claude</small></a>
  </div>
  <button type="button" aria-expanded="false" aria-controls="lnkv-menu">Versions · <span id="lnkv-cur"></span></button>
</div>
<script>
(function(){
  var cur = window.LINK_VERSION || "v2";
  var root = document.getElementById("lnkv"), btn = root.querySelector("button"), menu = document.getElementById("lnkv-menu");
  document.getElementById("lnkv-cur").textContent = cur;
  menu.querySelectorAll("a").forEach(function(a){ if(a.dataset.v===cur) a.setAttribute("aria-current","page"); a.target = a.dataset.v==="feedback" ? "_blank" : "_top"; if(a.dataset.v==="feedback") a.rel="noopener"; });
  btn.addEventListener("click", function(e){ e.stopPropagation(); menu.hidden = !menu.hidden; btn.setAttribute("aria-expanded", String(!menu.hidden)); });
  document.addEventListener("click", function(e){ if(!root.contains(e.target)){ menu.hidden = true; btn.setAttribute("aria-expanded","false"); } });
})();
</script>
